[tool.poetry]
name = "winter"
version = "32.1.1"
homepage = "https://github.com/WinterFramework/winter"
description = "Web Framework with focus on python typing, dataclasses and modular design"
authors = ["Alexander Egorov <mofr@zond.org>"]
classifiers = [
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Development Status :: 3 - Alpha',
    'Operating System :: OS Independent',
    'Environment :: Web Environment',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Framework :: Django',
    'Framework :: Django :: 4',
    'Framework :: Django :: 5',
    'Topic :: Software Development :: Libraries :: Application Frameworks',
]
packages = [
    { include = "winter" },
]

[tool.poetry.dependencies]
python = "^3.11"
Django = ">=4.2,<6"
docstring-parser = ">=0.1"
furl = ">=2.0.0, <3"
python-dateutil = "^2.8.2"
injector = ">=0.15.0, <1"
SQLAlchemy = ">=1.4, <2"
typing-extensions = "^4.8"
StrEnum = "^0.4.8"
openapi-pydantic = ">=0.5.0, <0.6"
pydantic = ">=2.13, <3"
openapi-spec-validator = ">=0.5.7, <1"
uritemplate = "==4.2.0"  # Lib doesn't follow semantic versioning
httpx = ">=0.24.1, <0.28"
redis = "^6.2.0"

[tool.poetry.dev-dependencies]
flake8 = ">=3.7.7, <4"
flake8-commas = ">=2.0.0, <4"
flake8-formatter-abspath = ">=1.0.1, <2"
pre-commit-hooks = ">=2.2.3, <3"
freezegun = ">=1.5.1, <2"
mock = ">=2.0.0, <3"
pytest = ">=7.0, <9"
pytest-pythonpath = ">=0.7.1"
pytest-cov = "^6.0.0"
pytest-django = ">=4.6.0, <5"
semver = ">=2.8.1, <3"
add-trailing-comma = ">=1.3.0, <2"
pre-commit = ">=1.17.0, <2"
lxml = ">=4.9.1, <6.0.0"
pytz = ">=2020.5"
import-linter = ">=2.0, <3"

[tool.poetry.group.dev.dependencies]
setuptools = "^71.1.0"
testcontainers = "^4.10.0"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
tag_format = "{version}"  # plain X.Y.Z, like all existing tags
commit_message = "chore(release): {version} [skip ci]"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_parser = "conventional"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = ['chore\(release\):.*']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
ignore_token_for_push = true  # push with the deploy key from actions/checkout, not GITHUB_TOKEN

[tool.semantic_release.branches.main]
match = "master"
prerelease = false

[tool.importlinter]
# Enforces the layer rules of docs/architecture.md.
root_packages = ["winter"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: adapters -> models -> foundations"
type = "layers"
layers = [
    "winter.django | winter.openapi | winter.sqlalchemy | winter.redis",
    "winter.web | winter.ddd | winter.messaging",
    "winter.components : winter.application : winter.json : winter.pagination",
]

[[tool.importlinter.contracts]]
name = "Models and foundations do not import web frameworks or infrastructure"
type = "forbidden"
source_modules = [
    "winter.components", "winter.application", "winter.json", "winter.pagination",
    "winter.web", "winter.ddd", "winter.messaging",
]
forbidden_modules = ["django", "redis", "sqlalchemy", "pydantic"]

[build-system]
requires = ["poetry-core>=1.3.1"]
build-backend = "poetry.core.masonry.api"
